<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="240" viewBox="0 0 440 240">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.18" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.13  0 0 0 0 0.05  0 0 0 1.4 -0.45" in="n" result="g"/>
    <feComposite in="g" in2="SourceGraphic" operator="in" result="gc"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gc"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06a35"/><stop offset="1" stop-color="#8a5627"/></linearGradient>
  <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94602d"/><stop offset="1" stop-color="#7d4c22"/></linearGradient>
  <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87138"/><stop offset="1" stop-color="#90592a"/></linearGradient>
  <g id="top">
    <g filter="url(#grain)">
      <rect x="40" y="40" width="360" height="40" fill="url(#p1)"/>
      <rect x="40" y="80" width="360" height="40" fill="url(#p2)"/>
      <rect x="40" y="120" width="360" height="40" fill="url(#p3)"/>
      <rect x="40" y="160" width="360" height="40" fill="url(#p2)"/>
    </g>
    <g stroke="#3e230c" stroke-width="2" opacity="0.8">
      <line x1="40" y1="80" x2="400" y2="80"/><line x1="40" y1="120" x2="400" y2="120"/><line x1="40" y1="160" x2="400" y2="160"/>
    </g>
    <ellipse cx="300" cy="138" rx="10" ry="5" fill="#5a3415" opacity="0.7"/>
    <ellipse cx="300" cy="138" rx="5" ry="2" fill="#3e230c" opacity="0.8"/>
    <rect x="40" y="40" width="360" height="160" rx="5" fill="none" stroke="#3a2009" stroke-width="5"/>
    <rect x="46" y="46" width="348" height="148" rx="3" fill="none" stroke="#c48a4c" stroke-width="1.5" opacity="0.5"/>
    <g fill="#2b1a0b">
      <circle cx="54" cy="60" r="2.2"/><circle cx="54" cy="100" r="2.2"/><circle cx="54" cy="140" r="2.2"/><circle cx="54" cy="180" r="2.2"/>
      <circle cx="386" cy="60" r="2.2"/><circle cx="386" cy="100" r="2.2"/><circle cx="386" cy="140" r="2.2"/><circle cx="386" cy="180" r="2.2"/>
    </g>
  </g>
  <clipPath id="cl"><polygon points="0,0 214,0 224,22 209,41 233,58 216,79 229,101 211,122 227,139 213,158 222,178 210,200 214,240 0,240"/></clipPath>
  <clipPath id="cr"><polygon points="440,0 214,0 224,22 209,41 233,58 216,79 229,101 211,122 227,139 213,158 222,178 210,200 214,240 440,240"/></clipPath>
  <clipPath id="chip"><polygon points="229,101 211,122 227,139 262,128 255,108"/></clipPath>
  <clipPath id="crHole"><polygon points="440,0 214,0 224,22 209,41 233,58 216,79 229,101 255,108 262,128 227,139 213,158 222,178 210,200 214,240 440,240"/></clipPath>
</defs>
<g filter="url(#shadow)"><g filter="url(#rot)"><use href="#top"/></g></g><clipPath id="tclip"><rect x="40" y="40" width="360" height="160" rx="5"/></clipPath>
<defs>
<filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="b5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="frost"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.97  0 0 0 0 1  0 0 0 1.6 -0.55"/></filter>
<filter id="ice" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".55 0 0 0 .1  0 .65 0 0 .25  0 .1 .5 0 .5  0 0 0 1 0"/></filter>
<filter id="rot" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".35 .3 .1 0 .02  .3 .35 .1 0 .03  .2 .25 .1 0 .01  0 0 0 1 0"/></filter>
<radialGradient id="scorch"><stop offset="0" stop-color="#120804" stop-opacity=".85"/><stop offset=".6" stop-color="#2a1206" stop-opacity=".5"/><stop offset="1" stop-color="#2a1206" stop-opacity="0"/></radialGradient>
<radialGradient id="acid"><stop offset="0" stop-color="#b6ff3a" stop-opacity=".95"/><stop offset=".55" stop-color="#5fbf1a" stop-opacity=".8"/><stop offset="1" stop-color="#2f6a0c" stop-opacity="0"/></radialGradient>
<radialGradient id="hole"><stop offset="0" stop-color="#0d1a05"/><stop offset=".7" stop-color="#1e3a0a" stop-opacity=".8"/><stop offset="1" stop-color="#2f5a10" stop-opacity="0"/></radialGradient>
<radialGradient id="gold"><stop offset="0" stop-color="#fff3b0" stop-opacity=".7"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient>
