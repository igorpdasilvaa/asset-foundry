9b48a"/><circle r="2.7" cx="-1.5" cy="-1.5" fill="#efe2c2"/></g><g transform="translate(98 78)"><circle r="5.5" fill="#2a1d12"/><circle r="4" fill="#c9b48a"/><circle r="1.8" cx="-1.0" cy="-1.0" fill="#efe2c2"/></g><g transform="translate(330 175)"><circle r="8.5" fill="#2a1d12"/><circle r="7" fill="#c9b48a"/><circle r="3.1" cx="-1.8" cy="-1.8" fill="#efe2c2"/></g><g transform="translate(318 182)"><circle r="6.0" fill="#2a1d12"/><circle r="4.5" fill="#c9b48a"/><circle r="2.0" cx="-1.1" cy="-1.1" fill="#efe2c2"/></g><g transform="translate(250 60)"><circle r="6.5" fill="#2a1d12"/><circle r="5" fill="#c9b48a"/><circle r="2.2" cx="-1.2" cy="-1.2" fill="#efe2c2"/></g></svg>
