93" cy="206" r="1.8" fill="#ff8a2a"/><circle cx="134" cy="54" r="2.2" fill="#ff8a2a"/><circle cx="76" cy="166" r="1.8" fill="#ff8a2a"/><circle cx="166" cy="73" r="2.2" fill="#ff8a2a"/><circle cx="348" cy="73" r="2.2" fill="#ff8a2a"/><circle cx="271" cy="67" r="1.3" fill="#ff8a2a"/><g filter="url(#sblur)" opacity=".35" fill="#9a9a9a"><ellipse cx="200" cy="90" rx="40" ry="18"/><ellipse cx="290" cy="150" rx="35" ry="15"/></g></svg>
