<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="240" viewBox="0 0 440 240" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.18" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.13  0 0 0 0 0.05  0 0 0 1.4 -0.45" in="n" result="g"/>
    <feComposite in="g" in2="SourceGraphic" operator="in" result="gc"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gc"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06a35"/><stop offset="1" stop-color="#8a5627"/></linearGradient>
  <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94602d"/><stop offset="1" stop-color="#7d4c22"/></linearGradient>
  <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87138"/><stop offset="1" stop-color="#90592a"/></linearGradient>
  <g id="top">
    <g filter="url(#grain)">
      <rect x="40" y="40" width="360" height="40" fill="url(#p1)"/>
      <rect x="40" y="80" width="360" height="40" fill="url(#p2)"/>
      <rect x="40" y="120" width="360" height="40" fill="url(#p3)"/>
      <rect x="40" y="160" width="360" height="40" fill="url(#p2)"/>
    </g>
    <g stroke="#3e230c" stroke-width="2" opacity="0.8">
      <line x1="40" y1="80" x2="400" y2="80"/><line x1="40" y1="120" x2="400" y2="120"/><line x1="40" y1="160" x2="400" y2="160"/>
    </g>
    <ellipse cx="300" cy="138" rx="10" ry="5" fill="#5a3415" opacity="0.7"/>
    <ellipse cx="300" cy="138" rx="5" ry="2" fill="#3e230c" opacity="0.8"/>
    <rect x="40" y="40" width="360" height="160" rx="5" fill="none" stroke="#3a2009" stroke-width="5"/>
    <rect x="46" y="46" width="348" height="148" rx="3" fill="none" stroke="#c48a4c" stroke-width="1.5" opacity="0.5"/>
    <g fill="#2b1a0b">
      <circle cx="54" cy="60" r="2.2"/><circle cx="54" cy="100" r="2.2"/><circle cx="54" cy="140" r="2.2"/><circle cx="54" cy="180" r="2.2"/>
      <circle cx="386" cy="60" r="2.2"/><circle cx="386" cy="100" r="2.2"/><circle cx="386" cy="140" r="2.2"/><circle cx="386" cy="180" r="2.2"/>
    </g>
  </g>
  <clipPath id="cl"><polygon points="0,0 214,0 224,22 209,41 233,58 216,79 229,101 211,122 227,139 213,158 222,178 210,200 214,240 0,240"/></clipPath>
  <clipPath id="cr"><polygon points="440,0 214,0 224,22 209,41 233,58 216,79 229,101 211,122 227,139 213,158 222,178 210,200 214,240 440,240"/></clipPath>
  <clipPath id="chip"><polygon points="229,101 211,122 227,139 262,128 255,108"/></clipPath>
  <clipPath id="crHole"><polygon points="440,0 214,0 224,22 209,41 233,58 216,79 229,101 255,108 262,128 227,139 213,158 222,178 210,200 214,240 440,240"/></clipPath>
</defs>
<g filter="url(#shadow)"><use href="#top"/></g><clipPath id="tableclip"><rect x="40" y="40" width="360" height="160" rx="5"/></clipPath>

<defs>
  <radialGradient id="scorch"><stop offset="0" stop-color="#120804" stop-opacity=".85"/><stop offset=".6" stop-color="#2a1206" stop-opacity=".5"/><stop offset="1" stop-color="#2a1206" stop-opacity="0"/></radialGradient>
  <radialGradient id="fireglow"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
  <filter id="fblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="sblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <g id="flame">
    <path d="M-22,4 C-30,-25 -10,-40 -6,-70 C2,-50 6,-58 4,-82 C18,-60 30,-40 22,4 Z" fill="#ff4a0e" filter="url(#fblur)" opacity=".9"/>
    <path d="M-16,4 C-22,-20 -6,-30 -3,-56 C4,-40 8,-46 6,-64 C16,-44 22,-28 16,4 Z" fill="#ff8f1c"/>
    <path d="M-9,4 C-12,-12 -2,-20 0,-38 C5,-26 9,-22 9,4 Z" fill="#ffd447"/>
    <path d="M-4,4 C-5,-6 0,-12 1,-20 C4,-12 5,-6 4,4 Z" fill="#fff4c4"/>
  </g>
</defs><ellipse cx="220" cy="120" rx="218" ry="118" fill="url(#fireglow)"/><g clip-path="url(#tableclip)"><ellipse cx="150" cy="110" rx="70" ry="45" fill="url(#scorch)"/><ellipse cx="270" cy="140" rx="80" ry="50" fill="url(#scorch)"/><ellipse cx="330" cy="80" rx="50" ry="35" fill="url(#scorch)"/><ellipse cx="110" cy="170" rx="45" ry="25" fill="url(#scorch)"/><ellipse cx="220" cy="70" rx="55" ry="30" fill="url(#scorch)"/></g><use href="#flame" transform="translate(140 125) scale(0.75)"/><use href="#flame" transform="translate(185 95) scale(0.55)"/><use href="#flame" transform="translate(250 150) scale(0.85)"/><use href="#flame" transform="translate(300 110) scale(0.65)"/><use href="#flame" transform="translate(345 90) scale(0.5)"/><use href="#flame" transform="translate(215 175) scale(0.5)"/><use href="#flame" transform="translate(110 165) scale(0.45)"/><use href="#flame" transform="translate(280 60) scale(0.4)"/><circle cx="378" cy="75" r="2" fill="#ffcf5a"/><circle cx="243" cy="213" r="2" fill="#ffcf5a"/><circle cx="331" cy="17" r="1.5" fill="#ffcf5a"/><circle cx="187" cy="176" r="1.2" fill="#ffcf5a"/><circle cx="140" cy="38" r="1.5" fill="#ffcf5a"/><circle cx="300" cy="73" r="1.5" fill="#ffcf5a"/><circle cx="338" cy="36" r="2" fill="#ffcf5a"/><circle cx="187" cy="13" r="2" fill="#ffcf5a"/><circle cx="170" cy="114" r="1.5" fill="#ffcf5a"/><circle cx="153" cy="206" r="1.5" fill="#ffcf5a"/><circle cx="141" cy="205" r="1.2" fill="#ffcf5a"/><circle cx="131" cy="168" r="2" fill="#ffcf5a"/><circle cx="287" cy="42" r="1.2" fill="#ffcf5a"/><circle cx="60" cy="11" r="1.2" fill="#ffcf5a"/><circle cx="170" cy="52" r="1.2" fill="#ffcf5a"/><circle cx="208" cy="90" r="1.2" fill="#ffcf5a"/><circle cx="336" cy="183" r="2" fill="#ffcf5a"/><circle cx="164" cy="56" r="2" fill="#ffcf5a"/></svg>
